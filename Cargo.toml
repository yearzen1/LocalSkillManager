[package]
name = "local-skill-manager"
version = "0.1.1"
edition = "2021"
description = "Install and copy agent skills under .agents/skills"
license = "MIT"

[lib]
name = "lsm"
path = "src/lib.rs"

[[bin]]
name = "lsm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = "4"
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml_edit = "0.22"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

